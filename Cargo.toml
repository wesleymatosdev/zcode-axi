[package]
name = "zcode-axi"
version = "0.1.0"
edition = "2021"
description = "Machine-friendly control plane around the official zcode CLI runtime"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
xcap = "0.9.8"
ocrs = "0.12.2"
rten = "0.24.0"
png = "0.18.1"

[profile.release]
strip = true
